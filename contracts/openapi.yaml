components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
      description: 服务端会话 Cookie。凭据不得放入 Query、响应体、错误详情或日志。

  parameters:
    RequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: 可选请求追踪 ID；缺失或格式不合法时由服务端生成。
      schema:
        type: string
        maxLength: 100
        pattern: "^[A-Za-z0-9][A-Za-z0-9._:-]{0,99}$"
    CompetitionId:
      name: competitionId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StageId:
      name: stageId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MatchId:
      name: matchId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      required: false
      description: 从 1 开始的页码，默认 1。
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: 每页数量，默认 20，最大 100。
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  headers:
    RequestId:
      description: 本次请求的追踪 ID。
      schema:
        type: string
        minLength: 1

  requestBodies:
    CompetitionWriteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CompetitionWriteRequest"
    StageWriteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StageWriteRequest"
    TeamWriteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/TeamWriteRequest"
    MatchWriteRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MatchWriteRequest"
    PredictionRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScoreLineRequest"

  responses:
    ValidationFailed:
      description: 请求输入不符合契约或业务校验规则。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: 未认证或会话无效。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: 已认证但没有权限执行该操作。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: 请求的资源不存在。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: 请求与当前资源状态冲突。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: 服务端发生未预期错误；响应不得包含 SQL、堆栈、密钥或内部路径。
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, service, timestamp]
      properties:
        status:
          const: ok
        service:
          type: string
          const: football-platform-api
        timestamp:
          type: string
          format: date-time

    Role:
      type: string
      enum: [USER, ADMIN]
    StageType:
      type: string
      enum: [GROUP, LEAGUE, KNOCKOUT]
    MatchStatus:
      type: string
      enum: [SCHEDULED, LIVE, FINISHED]
      description: 分别表示未开始、进行中、已结束。
    CommentModerationStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]
      description: 先发后审下，新评论默认 PENDING 且可见。
    ExternalProfileStatus:
      type: string
      enum: [AVAILABLE, UNAVAILABLE, NO_MATCH]

    User:
      type: object
      additionalProperties: false
      required: [id, username, role, createdAt]
      properties:
        id:
          type: integer
          minimum: 1
        username:
          type: string
          minLength: 3
          maxLength: 40
        role:
          $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: "^[A-Za-z0-9_]+$"
          description: 服务端去除首尾空白后校验，公开注册只能创建 USER。
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 40
          description: 服务端去除首尾空白后匹配账号。
        password:
          type: string
          minLength: 1
          maxLength: 72
    AuthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"
    UserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"

    Competition:
      type: object
      additionalProperties: false
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        description:
          type: string
          minLength: 0
          maxLength: 500
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CompetitionWriteRequest:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: 服务端去除首尾空白后校验。
        description:
          type: string
          minLength: 0
          maxLength: 500
          description: 服务端去除首尾空白后保存。
    CompetitionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Competition"
    CompetitionListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Competition"

    Stage:
      type: object
      additionalProperties: false
      required:
        [
          id,
          competitionId,
          name,
          type,
          groupName,
          sortOrder,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
          minimum: 1
        competitionId:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
        type:
          $ref: "#/components/schemas/StageType"
        groupName:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 40
          description: GROUP 阶段可用于区分小组；LEAGUE 和 KNOCKOUT 通常为 null。
        sortOrder:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    StageWriteRequest:
      type: object
      additionalProperties: false
      required: [competitionId, name, type, groupName, sortOrder]
      properties:
        competitionId:
          type: integer
          minimum: 1
        name:
          type: string
          minLength: 2
          maxLength: 80
          description: 服务端去除首尾空白后校验。
        type:
          $ref: "#/components/schemas/StageType"
        groupName:
          type:
            - string
