openapi: 3.1.0
info:
  title: Football Match Interaction Platform API
  version: 1.0.0
servers:
  - url: http://localhost:7001
tags:
  - name: Health
  - name: Auth
  - name: Competitions
  - name: Stages
  - name: Teams
  - name: Matches
  - name: Predictions
  - name: Favorites
  - name: Comments
  - name: Admin
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 检查 API 状态
      security: []
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: API 正常
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      summary: 注册普通用户
      security: []
      x-spec:
        file: specs/001-auth-and-user-identity.md
        acceptanceCriteria: [AC-01, AC-06]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: loginUser
      summary: 用户登录
      security: []
      x-spec:
        file: specs/001-auth-and-user-identity.md
        acceptanceCriteria: [AC-02, AC-05, AC-06]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Set-Cookie:
              description: 服务端设置的会话 Cookie。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logoutUser
      summary: 用户登出
      security:
        - cookieAuth: []
      x-spec:
        file: specs/001-auth-and-user-identity.md
        acceptanceCriteria: [AC-02]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "204":
          description: 登出成功，无响应体。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前用户
      security:
        - cookieAuth: []
      x-spec:
        file: specs/001-auth-and-user-identity.md
        acceptanceCriteria: [AC-02, AC-03, AC-05]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: 当前用户
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/competitions:
    get:
      tags: [Competitions]
      operationId: listCompetitions
      summary: 获取赛事列表
      security: []
      x-spec:
        file: specs/002-competition-stage-match.md
        acceptanceCriteria: [AC-01, AC-05, AC-06]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: 赛事列表，按创建顺序升序返回；无数据时 `data` 为空数组。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/competitions/{competitionId}:
    get:
      tags: [Competitions]
      operationId: getCompetition
      summary: 获取赛事详情
      security: []
      x-spec:
        file: specs/002-competition-stage-match.md
        acceptanceCriteria: [AC-02, AC-05, AC-06]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CompetitionId"
      responses:
        "200":
          description: 赛事详情
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/stages/{stageId}:
    get:
      tags: [Stages]
      operationId: getStage
      summary: 获取阶段详情
      security: []
      x-spec:
        file: specs/002-competition-stage-match.md
        acceptanceCriteria: [AC-02, AC-05]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: 阶段详情
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/stages/{stageId}/standings:
    get:
      tags: [Stages]
      operationId: getStageStandings
      summary: 获取小组赛或联赛积分榜
      security: []
      x-spec:
        file: specs/006-standings-and-bracket.md
        acceptanceCriteria: [AC-01, AC-02, AC-03, AC-05]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: 积分榜；GROUP 按分组返回，LEAGUE 返回单个无分组榜。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandingsResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 当前阶段类型不支持积分榜，例如 KNOCKOUT。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/stages/{stageId}/bracket:
    get:
      tags: [Stages]
      operationId: getStageBracket
      summary: 获取淘汰赛图
      security: []
      x-spec:
        file: specs/006-standings-and-bracket.md
        acceptanceCriteria: [AC-04, AC-06]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/StageId"
      responses:
        "200":
          description: 淘汰赛对阵图
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BracketResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 当前阶段类型不支持淘汰赛图，例如 GROUP 或 LEAGUE。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/teams:
    get:
      tags: [Teams]
      operationId: listTeams
      summary: 获取球队列表
      security: []
      x-spec:
        file: specs/003-teams.md
        acceptanceCriteria: [AC-01, AC-05]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: 球队列表，按名称升序和 ID 升序返回；无数据时 `data` 为空数组。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamListResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/teams/{teamId}:
    get:
      tags: [Teams]
      operationId: getTeam
      summary: 获取球队详情
      security: []
      x-spec:
        file: specs/003-teams.md
        acceptanceCriteria: [AC-02, AC-04]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: 球队详情，只包含本地权威资料。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/teams/{teamId}/external-profile:
    get:
      tags: [Teams]
      operationId: getTeamExternalProfile
      summary: 获取 OpenLigaDB 球队补充资料
      security: []
      x-spec:
        file: specs/009-real-team-api-integration.md
        acceptanceCriteria: [AC-01, AC-02, AC-03, AC-04]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: 外部资料查询结果；失败或无匹配也返回 200，并通过 `status` 区分降级状态。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalTeamProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/matches:
    get:
      tags: [Matches]
      operationId: listMatches
      summary: 获取比赛列表
      security: []
      x-spec:
        file: specs/002-competition-stage-match.md
        acceptanceCriteria: [AC-03, AC-05, AC-06]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - name: competitionId
          in: query
          required: false
          description: 按赛事筛选比赛。
          schema:
            type: integer
            minimum: 1
        - name: stageId
          in: query
          required: false
          description: 按阶段筛选比赛。
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          required: false
          description: 按比赛状态筛选。
          schema:
            $ref: "#/components/schemas/MatchStatus"
      responses:
        "200":
          description: 比赛列表，默认按开赛时间升序和 ID 升序返回；无匹配时 `data` 为空数组。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchListResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/matches/{matchId}:
    get:
      tags: [Matches]
      operationId: getMatch
      summary: 获取比赛详情
      security: []
      x-spec:
        file: specs/002-competition-stage-match.md
        acceptanceCriteria: [AC-04, AC-05, AC-06]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: 比赛详情，包含赛事、阶段、球队、状态和最新比赛结果。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/matches/{matchId}/prediction:
    get:
      tags: [Predictions]
      operationId: getMyMatchPrediction
      summary: 获取当前用户对单场比赛的有效预测
      security:
        - cookieAuth: []
      x-spec:
        file: specs/004-score-predictions.md
        acceptanceCriteria: [AC-01, AC-02, AC-05]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: 当前用户的有效预测；没有预测时 `data` 为 null。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NullablePredictionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Predictions]
      operationId: updateMyMatchPrediction
      summary: 修改当前用户对单场比赛的比分预测
      security:
        - cookieAuth: []
      x-spec:
        file: specs/004-score-predictions.md
        acceptanceCriteria: [AC-02, AC-04, AC-05, AC-07]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        $ref: "#/components/requestBodies/PredictionRequest"
      responses:
        "200":
          description: 修改成功，新预测成为唯一有效预测。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 比赛已经开始，禁止修改预测。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/matches/{matchId}/predictions:
    post:
      tags: [Predictions]
      operationId: createMyMatchPrediction
      summary: 创建当前用户对单场比赛的比分预测
      security:
        - cookieAuth: []
      x-spec:
        file: specs/004-score-predictions.md
        acceptanceCriteria: [AC-01, AC-03, AC-05, AC-06, AC-07]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        $ref: "#/components/requestBodies/PredictionRequest"
      responses:
        "201":
          description: 创建成功，成为该用户该比赛的唯一有效预测。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              description: 当前用户该比赛有效预测资源路径。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 比赛已经开始，或并发写入导致预测状态冲突。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/predictions:
    get:
      tags: [Predictions]
      operationId: listMyPredictions
      summary: 获取当前用户的有效预测列表
      security:
        - cookieAuth: []
      x-spec:
        file: specs/004-score-predictions.md
        acceptanceCriteria: [AC-01, AC-02, AC-05]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: 当前用户有效预测列表，按创建时间倒序和 ID 倒序返回。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PredictionListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/matches/{matchId}/favorite:
    post:
      tags: [Favorites]
      operationId: favoriteMatch
      summary: 收藏比赛
      security:
        - cookieAuth: []
      x-spec:
        file: specs/007-favorites.md
        acceptanceCriteria: [AC-01, AC-03, AC-04]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: 收藏成功；重复收藏返回当前有效收藏，不产生重复项。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Favorites]
      operationId: unfavoriteMatch
      summary: 取消收藏比赛
      security:
        - cookieAuth: []
      x-spec:
        file: specs/007-favorites.md
        acceptanceCriteria: [AC-02, AC-04]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/MatchId"
      responses:
        "204":
          description: 取消收藏成功；原本未收藏也视为成功。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/users/me/favorites:
    get:
      tags: [Favorites]
      operationId: listMyFavorites
      summary: 获取我的收藏比赛
      security:
        - cookieAuth: []
      x-spec:
        file: specs/007-favorites.md
        acceptanceCriteria: [AC-01, AC-02, AC-05]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
      responses:
        "200":
          description: 我的收藏列表，按收藏时间倒序和 ID 倒序返回；无收藏时 `data` 为空数组。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/matches/{matchId}/comments:
    get:
      tags: [Comments]
      operationId: listMatchComments
      summary: 分页获取比赛评论
      security: []
      x-spec:
        file: specs/008-comments-and-discussion.md
        acceptanceCriteria: [AC-01, AC-02, AC-03]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/MatchId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: 评论分页列表，默认按创建时间升序和 ID 升序返回；超出末页返回空数组。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentPageResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Comments]
      operationId: createMatchComment
      summary: 发表评论
      security:
        - cookieAuth: []
      x-spec:
        file: specs/008-comments-and-discussion.md
        acceptanceCriteria: [AC-01, AC-02, AC-07]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentWriteRequest"
      responses:
        "201":
          description: 发布成功；评论默认可见并进入待审核状态。
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Location:
              description: 新评论资源路径。
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
        "400":
          $ref: "#/components/responses/ValidationFailed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/comments/{commentId}:
    put:
      tags: [Comments]
      operationId: updateComment
      summary: 编辑自己的评论
      security:
        - cookieAuth: []
      x-spec:
        file: specs/008-comments-and-discussion.md
        acceptanceCriteria: [AC-04, AC-05]
      parameters:
        - $ref: "#/components/parameters/RequestIdHeader"
        - $ref: "#/components/parameters/CommentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentWriteRequest"
      responses:
        "200":
          description: 编辑成功
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommentResponse"
